name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "publish/v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pillow PySide6
      - name: Resolve and validate release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          CHANNEL="$(tr -d '\r\n' < BUILD_CHANNEL)"
          TAG="v${VERSION}"
          if [[ "$CHANNEL" != "STABLE" ]]; then
            echo "Refusing public release because BUILD_CHANNEL is $CHANNEL" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_TAG" != "$TAG" ]]; then
              echo "Requested tag $REQUESTED_TAG does not match VERSION $VERSION" >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "$TAG")" ]]; then
              echo "Checked-out commit does not match existing tag $TAG" >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION" >&2
            exit 1
          elif [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" != "publish/$TAG" ]]; then
            echo "Publication branch $GITHUB_REF_NAME does not match publish/$TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install package builders
        run: sudo apt-get update && sudo apt-get install -y libegl1 rpm
      - name: Check release
        run: ./scripts/check_release.sh
      - name: Build release assets
        run: ./scripts/build_release.sh "${{ steps.release.outputs.version }}"
      - name: Create release tag from publication branch
        if: github.ref_type == 'branch' && github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Open Hardware Control $TAG"
          git push origin "$TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          NOTES="docs/RELEASE_NOTES_v${VERSION}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" dist/* \
              --title "Open Hardware Control $TAG – Thermalright Levita, NZXT Kraken & RGB on Linux" \
              --notes-file "$NOTES" \
              --verify-tag
          else
            gh release create "$TAG" dist/* \
              --title "Open Hardware Control $TAG – Thermalright Levita, NZXT Kraken & RGB on Linux" \
              --generate-notes \
              --verify-tag
          fi
